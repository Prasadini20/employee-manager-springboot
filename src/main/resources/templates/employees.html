<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        :root {
            --bg-dark: #2e1e2d;
            --bg-panel: #f5f3f7;
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary: #3d2f50;
            --primary-strong: #22182d;
            --accent: #ff7f50;
            --accent-soft: #ffe7de;
            --success: #2e7d32;
            --success-soft: #e8f5e9;
            --text: #2e2e2e;
            --muted: #6b7280;
            --border: #dfe3e8;
            --shadow: 0 12px 30px rgba(34, 24, 45, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #38263d 0%, #1f1825 100%);
            color: var(--text);
        }

        .browser-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(40, 20, 31, 0.95);
            color: #f5f5f5;
            height: 48px;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .browser-left, .browser-right {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 180px;
        }

        .browser-right { justify-content: flex-end; }

        .browser-address {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
        }

        .browser-address .pill {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 7px 18px;
            min-width: 320px;
            text-align: center;
        }

        .page-shell {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 28px 32px;
            background: var(--bg-panel);
            min-height: calc(100vh - 48px);
        }

        .page-header {
            margin: 0 0 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 2vw, 3rem);
            color: #2b2f3a;
            letter-spacing: -0.04em;
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(61, 47, 80, 0.08);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.82rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 420px minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 22px 20px 18px;
        }

        .panel-title {
            margin: 0 0 18px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-strong);
        }

        form.card {
            max-width: none;
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #2f2f2f;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #b8bec7;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(61, 47, 80, 0.12);
            background: #fff;
        }

        .field-invalid {
            border-color: #d43f3a !important;
            box-shadow: 0 0 0 4px rgba(212, 63, 58, 0.08) !important;
        }

        .error {
            min-height: 18px;
            margin-top: 6px;
            color: #ba1b1b;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .client-error:empty {
            display: none;
        }

        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #564868 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(61, 47, 80, 0.25);
        }

        .secondary-btn {
            background: #eef2f8;
            color: var(--primary-strong);
            border: 1px solid var(--border);
        }

        .danger-btn {
            background: linear-gradient(135deg, #ef6b55 0%, #da4c3f 100%);
            color: #fff;
        }

        .table-panel {
            padding: 0;
            overflow: hidden;
        }

        .table-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 18px 10px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            max-width: 360px;
            border-radius: 10px;
        }

        .search-box a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
        }

        .employee-total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-strong);
            margin: 0;
        }

        .employee-total span {
            color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            margin-top: 8px;
        }

        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid #edf0f3;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: linear-gradient(180deg, #2d3a4a 0%, #213042 100%);
            color: #fff;
            font-size: 0.92rem;
            letter-spacing: 0.02em;
        }

        tbody tr {
            transition: background 0.2s ease, transform 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(61, 47, 80, 0.05);
        }

        tbody tr.hidden-row {
            display: none;
        }

        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tiny-btn {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
            line-height: 1.4;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }

        .edit-link {
            background: rgba(61, 47, 80, 0.08);
            color: var(--primary-strong);
            border-color: rgba(61, 47, 80, 0.12);
        }

        .delete-form {
            display: inline;
            margin: 0;
        }

        .delete-form button {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            background: rgba(218, 76, 63, 0.08);
            color: #b52323;
            border: 1px solid rgba(181, 35, 35, 0.12);
        }

        .success {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(46, 125, 50, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-weight: 700;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .success.fade-out {
            opacity: 0;
        }

        .no-results {
            text-align: center;
            padding: 24px 16px;
            color: var(--muted);
            font-weight: 600;
            display: none;
        }

        .no-results.visible {
            display: block;
        }

        @media (max-width: 980px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .page-shell {
                padding: 20px 14px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="browser-bar">
        <div class="browser-left">
            <span>←</span>
            <span>→</span>
            <span>⟳</span>
        </div>
        <div class="browser-address"><span class="pill">localhost:8080/employees</span></div>
        <div class="browser-right">
            <span>⌕</span>
            <span>☆</span>
            <span>◌</span>
        </div>
    </div>

    <div class="page-shell">
        <div class="page-header">
            <h1>Employee Management System</h1>
            <div class="header-tag">Live dashboard</div>
        </div>

        <div class="content-grid">
            <div>
                <div class="success" th:if="${success}" th:text="${success}"></div>

                <form id="employeeForm" class="card" th:action="@{/employees}" th:object="${employee}" method="post" novalidate>
                    <h2 class="panel-title">Add employee</h2>

                    <div class="field-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" th:field="*{fullName}" id="fullName" placeholder="Enter full name" required>
                        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        <div class="error client-error" data-error-for="fullName" aria-live="polite"></div>
                    </div>

                    <div class="field-group">
                        <label for="email">Email</label>
                        <input type="email" th:field="*{email}" id="email" placeholder="name@example.com" required>
                        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        <div class="error client-error" data-error-for="email" aria-live="polite"></div>
                    </div>

                    <div class="field-group">
                        <label for="phone">Phone</label>
                        <input type="tel" th:field="*{phone}" id="phone" placeholder="0711111111" required>
                        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        <div class="error client-error" data-error-for="phone" aria-live="polite"></div>
                    </div>

                    <div class="field-group">
                        <label for="department">Department</label>
                        <input type="text" th:field="*{department}" id="department" placeholder="Engineering" required>
                        <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                        <div class="error client-error" data-error-for="department" aria-live="polite"></div>
                    </div>

                    <div class="field-group">
                        <label for="salary">Salary (LKR)</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{salary}" id="salary" placeholder="50000" required>
                        <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                        <div class="error client-error" data-error-for="salary" aria-live="polite"></div>
                    </div>

                    <div class="button-row">
                        <button class="primary-btn" type="submit">Save Employee</button>
                        <button class="secondary-btn" type="reset">Reset</button>
                    </div>
                </form>
            </div>

            <div class="card table-panel">
                <div class="table-tools">
                    <form class="search-box" th:action="@{/employees}" method="get">
                        <input id="liveSearch" type="text" name="keyword" th:value="${keyword}" placeholder="Search by name">
                        <button class="primary-btn" type="submit">Search</button>
                        <a th:href="@{/employees}">Clear</a>
                    </form>

                    <p class="employee-total">Total employees: <span th:text="${employees.size()}">0</span></p>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                        <tr th:each="e : ${employees}" th:attr="data-name=${e.fullName}">
                            <td th:text="${e.id}"></td>
                            <td th:text="${e.fullName}"></td>
                            <td th:text="${e.email}"></td>
                            <td th:text="${e.phone}"></td>
                            <td th:text="${e.department}"></td>
                            <td th:text="${'LKR ' + #numbers.formatDecimal(e.salary, 1, 'COMMA', 2, 'POINT')}">LKR 0.00</td>
                            <td>
                                <div class="action-group">
                                    <a class="tiny-btn edit-link" th:href="@{/employees/{id}/edit(id=${e.id})}">Edit</a>
                                    <form class="delete-form" th:action="@{/employees/{id}/delete(id=${e.id})}" method="post"
                                          onsubmit="return confirm('Delete this employee?');">
                                        <button type="submit">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="no-results" id="noResults">No employees match your search.</div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const successBanner = document.querySelector('.success');
        if (successBanner) {
            setTimeout(() => successBanner.classList.add('fade-out'), 3200);
        }

        const employeeForm = document.getElementById('employeeForm');
        const formFields = [...employeeForm.querySelectorAll('input[required]')];

        function validateField(field) {
            const value = field.value.trim();
            let message = '';

            if (!value) {
                message = `${field.labels[0].textContent} is required`;
            } else if (field.type === 'email' && !field.validity.valid) {
                message = 'Enter a valid email';
            } else if (field.id === 'phone' && !/^\d{10}$/.test(value)) {
                message = 'Phone must be exactly 10 digits';
            } else if (field.id === 'salary' && (!field.validity.valid || Number(value) <= 0)) {
                message = 'Salary must be greater than 0';
            }

            const errorMessage = employeeForm.querySelector(`[data-error-for="${field.id}"]`);
            errorMessage.textContent = message;
            field.classList.toggle('field-invalid', Boolean(message));
            field.setAttribute('aria-invalid', String(Boolean(message)));
            return !message;
        }

        formFields.forEach(field => {
            field.addEventListener('input', () => validateField(field));
            field.addEventListener('blur', () => validateField(field));
        });

        employeeForm.addEventListener('reset', () => {
            formFields.forEach(field => {
                field.classList.remove('field-invalid');
                field.removeAttribute('aria-invalid');
                employeeForm.querySelector(`[data-error-for="${field.id}"]`).textContent = '';
            });
        });

        const liveSearch = document.getElementById('liveSearch');
        const tableRows = [...document.querySelectorAll('#employeeTableBody tr')];
        const noResults = document.getElementById('noResults');

        if (liveSearch) {
            liveSearch.addEventListener('input', () => {
                const keyword = liveSearch.value.trim().toLowerCase();
                let visibleCount = 0;

                tableRows.forEach(row => {
                    const fullName = (row.dataset.name || '').toLowerCase();
                    const match = !keyword || fullName.includes(keyword);
                    row.classList.toggle('hidden-row', !match);
                    if (match) visibleCount += 1;
                });

                noResults.classList.toggle('visible', visibleCount === 0);
            });
        }

        employeeForm.addEventListener('submit', function (event) {
            const isValid = formFields.map(validateField).every(Boolean);
            if (!isValid) {
                event.preventDefault();
                formFields.find(field => field.classList.contains('field-invalid'))?.focus();
            }
        });
    </script>
</body>
</html>
