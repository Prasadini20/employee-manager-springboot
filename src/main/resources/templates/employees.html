<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        h1 { color: #2c3e50; }
        form.card { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 13px; }
        .success { background: #d4edda; color: #155724; padding: 10px; margin: 10px 0; border-radius: 4px; }
        button { margin-top: 15px; padding: 8px 16px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 25px; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: #fff; }
        .inline { display: inline; }
    </style>
</head>
<body>
<h1>Employee Management System</h1>

<div class="success" th:if="${success}" th:text="${success}"></div>

<form class="card" th:action="@{/employees}" th:object="${employee}" method="post">
    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

    <label>Email</label>
    <input type="text" th:field="*{email}">
    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

    <label>Department</label>
    <input type="text" th:field="*{department}">
    <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>

    <label>Salary</label>
    <input type="number" step="0.01" th:field="*{salary}">
    <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>

    <button type="submit">Save Employee</button>
</form>

<!-- Search (Task 11) -->
<form th:action="@{/employees}" method="get" style="margin-top:25px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name" style="width:250px;">
    <button type="submit">Search</button>
    <a th:href="@{/employees}">Clear</a>
</form>

<h3>Total employees: <span th:text="${employees.size()}">0</span></h3>

<table>
    <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
        <th>Department</th><th>Salary</th><th>Actions</th>
    </tr>
    <tr th:each="e : ${employees}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.fullName}"></td>
        <td th:text="${e.email}"></td>
        <td th:text="${e.phone}"></td>
        <td th:text="${e.department}"></td>
        <td th:text="${e.salary}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${e.id})}">Edit</a>
            <form class="inline" th:action="@{/employees/{id}/delete(id=${e.id})}" method="post"
                  onsubmit="return confirm('Delete this employee?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
