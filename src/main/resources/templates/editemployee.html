<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 13px; }
        button { margin-top: 15px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

    <label>Email</label>
    <input type="text" th:field="*{email}">
    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

    <label>Department</label>
    <input type="text" th:field="*{department}">
    <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>

    <label>Salary</label>
    <input type="number" step="0.01" th:field="*{salary}">
    <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>

    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
</form>
</body>
</html>
