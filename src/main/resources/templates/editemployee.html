<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <style>
        :root {
            --primary: #3d2f50;
            --primary-strong: #22182d;
            --bg: #f4f1f7;
            --card: #ffffff;
            --border: #dfe3e8;
            --text: #2f2f2f;
            --muted: #6b7280;
            --danger: #c23333;
            --shadow: 0 14px 30px rgba(34, 24, 45, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #38263d 0%, #1f1825 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: min(620px, 100%);
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        h1 {
            margin: 0 0 24px;
            color: var(--primary-strong);
            font-size: clamp(2rem, 2vw, 2.5rem);
            letter-spacing: -0.04em;
        }

        form {
            display: block;
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #b8bec7;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(61, 47, 80, 0.12);
        }

        .error {
            min-height: 18px;
            margin-top: 6px;
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .button-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        button, .cancel-link {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

        button:hover, .cancel-link:hover {
            transform: translateY(-1px);
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, #564868 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(61, 47, 80, 0.25);
        }

        .cancel-link {
            background: #eef2f8;
            color: var(--primary-strong);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Edit Employee</h1>

    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
        <div class="field-group">
            <label for="fullName">Full Name</label>
            <input type="text" th:field="*{fullName}" id="fullName">
            <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="field-group">
            <label for="email">Email</label>
            <input type="text" th:field="*{email}" id="email">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="field-group">
            <label for="phone">Phone</label>
            <input type="text" th:field="*{phone}" id="phone">
            <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="field-group">
            <label for="department">Department</label>
            <input type="text" th:field="*{department}" id="department">
            <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <div class="field-group">
            <label for="salary">Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" id="salary">
            <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>

        <div class="button-row">
            <button type="submit">Update Employee</button>
            <a class="cancel-link" th:href="@{/employees}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
